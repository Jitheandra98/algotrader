[tool.poetry]
name = "algotrader"
version = "0.1.0"
description = "Event-driven, multi-asset, multi-strategy trading bot with paper/live parity."
authors = ["jitheandra <jitheandra98@gmail.com>"]
readme = "README.md"
packages = [
    { include = "core" },
    { include = "data" },
    { include = "features" },
    { include = "strategies" },
    { include = "risk" },
    { include = "execution" },
    { include = "monitoring" },
    { include = "persistence" },
    { include = "backtest" },
    { include = "ml" },
    { include = "journal" },
    { include = "research" },
]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6"
pydantic-settings = "^2.2"
attrs = "^23.2"
structlog = "^24.1"
redis = {extras = ["hiredis"], version = "^5.0"}
asyncpg = "^0.29"
alembic = "^1.13"
sqlalchemy = "^2.0"
pyyaml = "^6.0"
uvloop = {version = "^0.19", markers = "sys_platform != 'win32'"}
orjson = "^3.9"
python-dateutil = "^2.9"
typer = "^0.12"
rich = "^13.7"
httpx = "^0.27"
websockets = "^12.0"
tenacity = "^8.2"
prometheus-client = "^0.20"
fastapi = "^0.110"
uvicorn = {extras = ["standard"], version = "^0.29"}
scikit-learn = "^1.4"
joblib = "^1.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
hypothesis = "^6.99"
ruff = "^0.3"
black = "^24.3"
mypy = "^1.9"
types-pyyaml = "^6.0"
types-python-dateutil = "^2.9"
fakeredis = "^2.21"

[tool.poetry.scripts]
algotrader = "core.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---- Tooling ----

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["research/notebooks"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes/pycodestyle
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "TID",           # tidy imports
    "PL",            # pylint
    "PT",            # pytest style
    "T20",           # no print
    "ASYNC",
]
ignore = [
    "PLR0913",  # too many args (false positives in DI)
    "PLR2004",  # magic value comparison (noisy)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["research/notebooks/"]

[[tool.mypy.overrides]]
module = ["fakeredis.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "integration: requires docker services (redis, postgres)",
    "slow: long-running tests",
]

[tool.coverage.run]
branch = true
source = ["core", "data", "features", "strategies", "risk", "execution", "monitoring", "persistence", "backtest", "ml", "journal", "research"]
omit = ["*/migrations/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
