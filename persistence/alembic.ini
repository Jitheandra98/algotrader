# alembic.ini — wiring is deferred to M2 when we start using ORM/Alembic for
# additional migrations. For M1 the raw SQL file in migrations/ is the source of
# truth; `make migrate` will run alembic upgrade head once this is wired.
[alembic]
script_location = migrations
sqlalchemy.url = postgresql://algotrader:algotrader@localhost:5432/algotrader

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
