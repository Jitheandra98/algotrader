apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: algotrader
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: algotrader
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: timescale/timescaledb:latest-pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: algotrader
            - name: POSTGRES_USER
              value: algotrader
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: algotrader-secrets
                  key: DATABASE_URL  # parsed at startup by an init script
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "1000m"
              memory: 4Gi
            limits:
              cpu: "4000m"
              memory: 16Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
